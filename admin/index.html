<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brow Derma — Admin</title>
<script src="../cms-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0a0a0a;
  --s1:       #111;
  --s2:       #1a1a1a;
  --s3:       #222;
  --border:   rgba(255,255,255,.07);
  --borderact:rgba(255,255,255,.15);
  --text:     #ede8e2;
  --muted:    #666;
  --gold:     #B8955A;
  --gold-lt:  #D4AF78;
  --danger:   #f87171;
  --success:  #4ade80;
  --info:     #60a5fa;
  --r:        3px;
  --nav-w:    56px;
  --nav-exp:  220px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;display:flex;position:relative;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
.hidden{display:none!important;}

/* ── NAV SIDEBAR ─────────────────────────────────────────────── */
#nav{
  width:var(--nav-w);flex-shrink:0;
  background:var(--s1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;
  transition:width .22s cubic-bezier(.4,0,.2,1);overflow:hidden;z-index:100;
  position:relative;
}
#nav.expanded{width:var(--nav-exp);}
.nav-logo{
  height:56px;display:flex;align-items:center;padding:0 14px;
  font-size:.6rem;letter-spacing:.28em;font-weight:700;color:var(--gold);
  border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;
}
.nav-logo .logo-short{flex-shrink:0;font-size:.85rem;}
.nav-logo .logo-full{
  margin-left:10px;opacity:0;transition:opacity .15s;pointer-events:none;
  white-space:nowrap;overflow:hidden;
}
#nav.expanded .nav-logo .logo-full{opacity:1;}
.nav-toggle{
  position:absolute;top:16px;right:-14px;
  width:14px;height:28px;background:var(--s2);
  border:1px solid var(--border);border-left:none;
  border-radius:0 var(--r) var(--r) 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;color:var(--muted);z-index:101;
  transition:color .15s;
}
.nav-toggle:hover{color:var(--text);background:var(--s3);}
.nav-items{flex:1;padding:.5rem 0;overflow-y:auto;overflow-x:hidden;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:.65rem 16px;cursor:pointer;white-space:nowrap;
  color:var(--muted);transition:background .15s,color .15s;
  border-left:2px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text);}
.nav-item.active{border-left-color:var(--gold);color:var(--gold);background:rgba(184,149,90,.06);}
.nav-icon{width:24px;text-align:center;flex-shrink:0;font-size:14px;font-style:normal;}
.nav-label{font-size:.8rem;font-weight:500;opacity:0;transition:opacity .1s;white-space:nowrap;}
#nav.expanded .nav-label{opacity:1;}
.nav-bottom{padding:.5rem 0;border-top:1px solid var(--border);}

/* ── MAIN AREA ───────────────────────────────────────────────── */
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* Top bar */
#topbar{
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem;background:var(--s1);border-bottom:1px solid var(--border);
  flex-shrink:0;gap:1rem;
}
.topbar-title{font-size:.85rem;font-weight:600;color:var(--text);}
.topbar-right{display:flex;align-items:center;gap:.6rem;}
#dirty-badge{
  font-size:.68rem;background:rgba(184,149,90,.15);color:var(--gold);
  padding:.2rem .6rem;border-radius:2rem;
}
.preview-link{font-size:.72rem;color:var(--muted);text-decoration:none;letter-spacing:.06em;}
.preview-link:hover{color:var(--text);}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.55rem 1.1rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  font-family:inherit;font-weight:600;cursor:pointer;border:none;border-radius:var(--r);
  transition:all .15s;white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-gold{background:var(--gold);color:#1a0c03;}
.btn-gold:hover{background:var(--gold-lt);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{border-color:var(--borderact);color:var(--text);}
.btn-danger{background:transparent;border:1px solid rgba(248,113,113,.3);color:var(--danger);}
.btn-danger:hover{background:rgba(248,113,113,.08);}
.btn-sm{padding:.35rem .7rem;font-size:.67rem;}
.btn-xs{padding:.2rem .5rem;font-size:.62rem;}
.btn-full{width:100%;}
.btn:disabled{opacity:.4;pointer-events:none;}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,.15);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;}

/* ── CONTENT PANEL ───────────────────────────────────────────── */
#content-area{
  flex:1;display:flex;overflow:hidden;
}
.panel{
  flex:1;overflow-y:auto;padding:2rem 2.5rem;
  display:flex;flex-direction:column;gap:1.5rem;
}
.panel-head{margin-bottom:.5rem;}
.panel-head h2{font-size:1rem;font-weight:600;color:var(--text);}
.panel-head p{font-size:.78rem;color:var(--muted);margin-top:.25rem;}

/* Section list (page builder) */
#sections-list{display:flex;flex-direction:column;gap:.5rem;}
.section-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.75rem 1rem;background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);cursor:default;transition:border-color .15s;
}
.section-item:hover{border-color:var(--borderact);}
.section-item.dragging{opacity:.4;}
.section-item.drag-over{border-color:var(--gold);background:rgba(184,149,90,.07);}
.drag-handle{
  cursor:grab;color:var(--muted);font-size:1rem;
  padding:0 2px;user-select:none;flex-shrink:0;
}
.drag-handle:active{cursor:grabbing;}
.section-icon{width:22px;text-align:center;color:var(--muted);flex-shrink:0;font-size:12px;}
.section-name{flex:1;font-size:.82rem;font-weight:500;}
.section-actions{display:flex;align-items:center;gap:.4rem;}
.vis-toggle{
  width:34px;height:20px;background:rgba(255,255,255,.1);
  border-radius:10px;cursor:pointer;position:relative;border:none;
  transition:background .2s;flex-shrink:0;
}
.vis-toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:14px;height:14px;background:#fff;border-radius:50%;
  transition:left .2s;
}
.vis-toggle.on{background:var(--gold);}
.vis-toggle.on::after{left:17px;}

/* Add section modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:1rem;
}
.modal{
  background:var(--s2);border:1px solid var(--border);
  width:100%;max-width:580px;max-height:80vh;overflow-y:auto;
  border-radius:var(--r);
}
.modal-head{
  padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{font-size:.9rem;font-weight:600;}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:1.5rem;}
.section-templates{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;}
.tpl-card{
  padding:1rem;background:var(--s3);border:1px solid var(--border);
  border-radius:var(--r);cursor:pointer;text-align:center;
  transition:border-color .15s,background .15s;
}
.tpl-card:hover{border-color:var(--gold);background:rgba(184,149,90,.06);}
.tpl-icon{font-size:1.5rem;margin-bottom:.5rem;}
.tpl-name{font-size:.75rem;font-weight:600;color:var(--text);}
.tpl-desc{font-size:.65rem;color:var(--muted);margin-top:.2rem;}

/* Pages list */
.pages-grid{display:flex;flex-direction:column;gap:.6rem;}
.page-card{
  display:flex;align-items:center;gap:1rem;
  padding:.85rem 1rem;background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);transition:border-color .15s;
}
.page-card:hover{border-color:var(--borderact);}
.page-status{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--success);
}
.page-status.draft{background:var(--muted);}
.page-info{flex:1;}
.page-title{font-size:.85rem;font-weight:600;}
.page-slug{font-size:.7rem;color:var(--muted);margin-top:.1rem;}
.page-actions{display:flex;gap:.4rem;}

/* New page form */
.new-page-form{
  background:var(--s2);border:1px solid var(--border);
  padding:1.2rem;border-radius:var(--r);
  display:flex;flex-direction:column;gap:.8rem;
}

/* Fields */
.cms-field{display:flex;flex-direction:column;gap:.4rem;}
.cms-label{
  font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:.4rem;
}
.type-badge{
  font-size:.58rem;background:rgba(255,255,255,.06);
  padding:.1rem .35rem;border-radius:2px;text-transform:none;letter-spacing:0;
}
.dirty-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;display:none;}
.cms-field.is-dirty .dirty-dot{display:inline-block;}
.cms-input,.cms-textarea{
  background:var(--s3);border:1px solid var(--border);color:var(--text);
  padding:.6rem .8rem;font-size:.83rem;font-family:inherit;
  border-radius:var(--r);transition:border-color .15s;outline:none;width:100%;
}
.cms-input:focus,.cms-textarea:focus{border-color:var(--gold);}
.cms-textarea{resize:vertical;min-height:80px;line-height:1.6;}
.cms-textarea.html-field{font-family:'Courier New',monospace;font-size:.76rem;}
.field-hint{font-size:.68rem;color:var(--muted);}
.fields-grid{display:flex;flex-direction:column;gap:1.2rem;}
.fields-divider{border:none;border-top:1px solid var(--border);margin:.25rem 0;}

/* Image field */
.image-field{display:flex;flex-direction:column;gap:.7rem;}
.image-preview{
  width:100px;height:68px;border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;background:var(--s3);display:flex;align-items:center;justify-content:center;
}
.image-preview img{width:100%;height:100%;object-fit:cover;}
.no-img{font-size:.65rem;color:var(--muted);}
.image-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}

/* FAQ editor */
.faq-editor{display:flex;flex-direction:column;gap:.75rem;}
.faq-pair{
  background:var(--s3);border:1px solid var(--border);
  border-radius:var(--r);padding:.85rem;
  display:flex;flex-direction:column;gap:.5rem;
}
.faq-pair-num{font-size:.62rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.faq-pair-row{display:flex;gap:.4rem;align-items:flex-start;}
.faq-pair-row .cms-input,.faq-pair-row .cms-textarea{flex:1;}

/* Design panel */
.design-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;}
.color-field{display:flex;flex-direction:column;gap:.4rem;}
.color-row{display:flex;align-items:center;gap:.6rem;}
.color-swatch{
  width:36px;height:36px;border-radius:var(--r);
  border:1px solid var(--border);cursor:pointer;
  padding:0;background:none;flex-shrink:0;overflow:hidden;
}
.color-swatch input[type=color]{
  width:200%;height:200%;border:none;padding:0;
  cursor:pointer;margin:-25% 0 0 -25%;
}
.color-val{
  flex:1;background:var(--s3);border:1px solid var(--border);
  color:var(--text);padding:.4rem .6rem;font-size:.75rem;
  font-family:'Courier New',monospace;border-radius:var(--r);outline:none;
}
.color-val:focus{border-color:var(--gold);}

/* Media library */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.6rem;}
.media-item{
  position:relative;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--border);aspect-ratio:1;cursor:pointer;
  transition:border-color .15s;
}
.media-item:hover{border-color:var(--gold);}
.media-item img{width:100%;height:100%;object-fit:cover;display:block;}
.media-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;
  opacity:0;transition:opacity .15s;
}
.media-item:hover .media-overlay{opacity:1;}
.media-filename{font-size:.6rem;color:rgba(255,255,255,.6);padding:.2rem .4rem;text-align:center;word-break:break-all;}
.upload-zone{
  border:2px dashed var(--border);border-radius:var(--r);padding:2rem;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
}
.upload-zone:hover,.upload-zone.drag-active{
  border-color:var(--gold);background:rgba(184,149,90,.05);
}
.upload-zone p{font-size:.78rem;color:var(--muted);margin-top:.5rem;}

/* Dashboard stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
.stat-card{
  background:var(--s2);border:1px solid var(--border);
  padding:1rem 1rem;border-radius:var(--r);
}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--gold);line-height:1;}
.stat-lbl{font-size:.62rem;color:var(--muted);margin-top:.35rem;text-transform:uppercase;letter-spacing:.08em;}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;}
.quick-actions .btn{justify-content:flex-start;text-align:left;text-transform:none;letter-spacing:0;font-size:.78rem;}

/* Toast */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;
  padding:.65rem 1.1rem;border-radius:var(--r);font-size:.78rem;font-weight:500;
  transform:translateY(8px);opacity:0;transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:.5rem;
}
.toast.show{transform:none;opacity:1;}
.toast.success{background:#14532d;color:var(--success);border:1px solid #166534;}
.toast.error{background:#450a0a;color:var(--danger);border:1px solid #7f1d1d;}
.toast.info{background:#1e3a5f;color:var(--info);border:1px solid #1d4ed8;}

/* Login */
#login-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:300;padding:1.5rem;
}
.login-card{width:100%;max-width:360px;background:var(--s2);border:1px solid var(--border);padding:2.2rem;}
.login-logo{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:1.8rem;}
.login-logo strong{color:var(--gold);}
.login-card h1{font-size:1.1rem;font-weight:600;margin-bottom:.3rem;}
.login-card p{font-size:.78rem;color:var(--muted);margin-bottom:1.8rem;}
.field-group{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem;}
.field-group label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
#login-error{font-size:.75rem;color:var(--danger);min-height:1.2em;margin-bottom:.8rem;}
.lockout{font-size:.75rem;color:var(--danger);text-align:center;margin-top:.8rem;}

/* Config warning */
.config-warn{
  max-width:400px;margin:2rem auto;text-align:center;
  background:rgba(184,149,90,.07);border:1px solid rgba(184,149,90,.2);padding:1.5rem;border-radius:var(--r);
}
.config-warn h3{color:var(--gold);margin-bottom:.5rem;}
.config-warn p{font-size:.78rem;color:var(--muted);line-height:1.7;}
.config-warn code{background:rgba(255,255,255,.06);padding:.1rem .35rem;border-radius:2px;font-size:.75rem;}

/* Section sub-nav (for content editing per section) */
.section-tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.section-tab{
  padding:.4rem .85rem;font-size:.72rem;border-radius:2rem;cursor:pointer;
  background:var(--s2);border:1px solid var(--border);color:var(--muted);
  transition:all .15s;
}
.section-tab:hover{color:var(--text);border-color:var(--borderact);}
.section-tab.active{background:var(--gold);color:#1a0c03;border-color:var(--gold);font-weight:600;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px;}

@media(max-width:600px){
  :root{--nav-w:48px;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .quick-actions{grid-template-columns:1fr;}
  .section-templates{grid-template-columns:repeat(2,1fr);}
  .design-grid{grid-template-columns:1fr;}
  .panel{padding:1.2rem 1rem;}
  #topbar{padding:0 .8rem;}
  .topbar-right .preview-link{display:none;}
}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <p class="login-logo"><strong>BROW</strong> ✦ <strong>DERMA</strong></p>
    <h1>Administration</h1>
    <p>Connectez-vous pour gérer votre site.</p>
    <div id="login-error" role="alert"></div>
    <form id="login-form">
      <div class="field-group">
        <label>Email</label>
        <input class="cms-input" id="l-email" type="email" autocomplete="email" placeholder="admin@email.com" required>
      </div>
      <div class="field-group">
        <label>Mot de passe</label>
        <input class="cms-input" id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-gold btn-full" id="login-btn">Se connecter</button>
    </form>
    <p class="lockout hidden" id="lockout-msg"></p>
  </div>
</div>

<!-- App shell -->
<nav id="nav">
  <div class="nav-logo">
    <span class="logo-short">BD</span>
    <span class="logo-full">BROW DERMA ADMIN</span>
  </div>
  <div class="nav-items" id="nav-items"></div>
  <div class="nav-bottom" id="nav-bottom"></div>
</nav>
<button class="nav-toggle" id="nav-toggle" aria-label="Réduire/agrandir">›</button>

<div id="workspace">
  <header id="topbar">
    <span class="topbar-title" id="topbar-title">Tableau de bord</span>
    <div class="topbar-right">
      <span class="dirty-badge hidden" id="dirty-badge"></span>
      <a href="../" target="_blank" class="preview-link">Voir le site ↗</a>
      <button class="btn btn-gold btn-sm" id="publish-btn" disabled>Publier</button>
    </div>
  </header>
  <div id="content-area">
    <div class="panel" id="panel"></div>
  </div>
</div>

<!-- Modal overlay -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modal-title">Ajouter une section</h3>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

// ── CONFIG ──────────────────────────────────────────────────────
var cfg   = window.CMS_CONFIG;
var cfgOk = cfg && cfg.url && cfg.url !== 'YOUR_SUPABASE_URL';
var sb    = null;

// ── STATE ────────────────────────────────────────────────────────
var S = {
  view:     'dashboard',
  content:  {},    // key → row
  sections: [],    // page_sections rows
  pages:    [],    // pages rows
  media:    [],    // storage objects
  dirty:    {},    // key → new value
  dirtySection: false,
  saving:   false,
  activeContentSection: 'seo'
};

// ── VIEWS ─────────────────────────────────────────────────────────
var VIEWS = [
  { id:'dashboard',  label:'Tableau de bord', icon:'⊞' },
  { id:'pages',      label:'Pages',           icon:'◻' },
  { id:'sections',   label:'Mise en page',    icon:'⠿' },
  { id:'content',    label:'Contenu',         icon:'✏' },
  { id:'design',     label:'Design',          icon:'◑' },
  { id:'media',      label:'Médias',          icon:'⊡' },
  { id:'seo',        label:'SEO',             icon:'◎' },
  { id:'settings',   label:'Paramètres',      icon:'⚙' },
];

// ── CONTENT SECTIONS ─────────────────────────────────────────────
var CONTENT_SECTIONS = [
  { id:'seo', label:'SEO', fields:[
    {key:'seo.title',          label:'Titre de page',       type:'text'},
    {key:'seo.description',    label:'Meta description',    type:'textarea'},
    {key:'seo.og_title',       label:'OG Title',            type:'text'},
    {key:'seo.og_description', label:'OG Description',      type:'textarea'},
  ]},
  { id:'hero', label:'Héro', fields:[
    {key:'hero.eyebrow',    label:'Accroche dorée',    type:'text'},
    {key:'hero.title',      label:'Titre principal',   type:'html', hint:'&lt;br&gt; &lt;em&gt; supportés'},
    {key:'hero.subtitle',   label:'Sous-titre',        type:'textarea'},
    {key:'hero.cta_primary',label:'Bouton principal',  type:'text'},
    {key:'hero.badge_label',label:'Badge — texte',     type:'text'},
    {key:'hero.badge_value',label:'Badge — valeur',    type:'text'},

// ── BRUTE FORCE ──────────────────────────────────────────────────
var BF = 'bd_bf';
function bfGet(){try{return JSON.parse(localStorage.getItem(BF))||{a:0,u:0};}catch(e){return{a:0,u:0};}}
function bfSet(o){localStorage.setItem(BF,JSON.stringify(o));}
function bfCheck(){var d=bfGet(),n=Date.now();if(d.u&&n<d.u){var m=Math.ceil((d.u-n)/60000);return 'Bloqué. Réessayez dans '+m+' min.';}return null;}
function bfFail(){var d=bfGet();d.a=(d.a||0)+1;if(d.a>=5){d.u=Date.now()+15*60000;d.a=0;}bfSet(d);}
function bfReset(){bfSet({a:0,u:0});}

var _tt=null;
function toast(msg,type){
  var el=document.getElementById('toast');
  el.innerHTML=msg;el.className='toast '+(type||'success');
  clearTimeout(_tt);
  requestAnimationFrame(function(){el.classList.add('show');});
  _tt=setTimeout(function(){el.classList.remove('show');},3500);
}

}

// ── PUBLISH ──────────────────────────────────────────────────────
async function publish(){
  if(!sb)return;
  var btn=document.getElementById('publish-btn');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  var errors=[];

  // 1. Content
  var contentKeys=Object.keys(S.dirty);
  if(contentKeys.length){
    var rows=contentKeys.map(function(k){
      var orig=S.content[k]||{};
      return{key:k,value:S.dirty[k],type:orig.type||'text',section:orig.section||'',label:orig.label||k};
    });
    var res=await sb.from('content').upsert(rows,{onConflict:'key'});
    if(res.error)errors.push(res.error.message);
    else{rows.forEach(function(r){if(!S.content[r.key])S.content[r.key]=r;S.content[r.key].value=r.value;});S.dirty={};}
  }

  // 2. Sections order/visibility
  if(S.dirtySection){
    var secRows=S.sections.map(function(s){return{page:s.page||'home',section_id:s.section_id,label:s.label,icon:s.icon||'◈',position:s.position,visible:s.visible};});
    var res2=await sb.from('page_sections').upsert(secRows,{onConflict:'page,section_id'});
    if(res2.error)errors.push(res2.error.message);
    else S.dirtySection=false;
  }

  updateDirtyBadge();
  btn.disabled=false;btn.textContent='Publier';

  if(errors.length)toast('Erreur : '+errors[0],'error');
  else toast('✓ Publié avec succès.','success');
}

// Drag & Drop
var dragSrc=null;
function initSectionDnD(){
  var list=document.getElementById('sections-list');
  if(!list)return;
  list.querySelectorAll('.section-item').forEach(function(item){
    item.addEventListener('dragstart',function(e){
      dragSrc=item;e.dataTransfer.effectAllowed='move';
      setTimeout(function(){item.classList.add('dragging');},0);
    });
    item.addEventListener('dragend',function(){
      item.classList.remove('dragging');
      list.querySelectorAll('.section-item').forEach(function(i){i.classList.remove('drag-over');});
    });
    item.addEventListener('dragover',function(e){
      e.preventDefault();e.dataTransfer.dropEffect='move';
      if(dragSrc&&dragSrc!==item)item.classList.add('drag-over');
    });
    item.addEventListener('dragleave',function(){item.classList.remove('drag-over');});
    item.addEventListener('drop',function(e){
      e.preventDefault();
      if(dragSrc&&dragSrc!==item){
        var items=Array.from(list.querySelectorAll('.section-item'));
        var si=items.indexOf(dragSrc),di=items.indexOf(item);
        if(si<di)list.insertBefore(dragSrc,item.nextSibling);
        else list.insertBefore(dragSrc,item);
        item.classList.remove('drag-over');
        // Update positions in state
        Array.from(list.querySelectorAll('.section-item')).forEach(function(el,idx){
          var sec=S.sections.find(function(s){return s.section_id===el.getAttribute('data-section');});
          if(sec)sec.position=idx+1;
        });
        S.dirtySection=true;
        updateDirtyBadge();
      }
    });
  });
}

    var val=S.dirty.hasOwnProperty(f.key)?S.dirty[f.key]:(S.content[f.key]?S.content[f.key].value:'');
    var isDirty=S.dirty.hasOwnProperty(f.key);
    html+='<div class="cms-field'+(isDirty?' is-dirty':'')+'" data-key="'+esc(f.key)+'">'+
      '<label class="cms-label"><span class="dirty-dot"></span>'+esc(f.label)+' <span class="type-badge">'+f.type+'</span></label>';
    if(f.type==='text'){
      html+='<input class="cms-input" type="text" value="'+esc(val)+'" data-key="'+esc(f.key)+'">';
    }else if(f.type==='textarea'||f.type==='html'){
      html+='<textarea class="cms-textarea'+(f.type==='html'?' html-field':'')+'" data-key="'+esc(f.key)+'">'+esc(val)+'</textarea>';
    }else if(f.type==='image'){
      html+=renderImageField(f.key,val);
    }else if(f.type==='faq'){
      html+=renderFaqEditor(val);
    }
    if(f.hint)html+='<p class="field-hint">'+f.hint+'</p>';
    html+='</div>';
  });
  html+='</div>';
  container.innerHTML=html;

  // Listeners
  container.querySelectorAll('.cms-input,.cms-textarea').forEach(function(el){
    el.addEventListener('input',function(){
      var key=el.getAttribute('data-key');
      markDirty(key,el.value);
      var fd=container.querySelector('.cms-field[data-key="'+key+'"]');
      if(fd)fd.classList.add('is-dirty');
    });
  });

  // Image
  container.querySelectorAll('.img-upload-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var inp=container.querySelector('.img-file-input[data-key="'+btn.getAttribute('data-key')+'"]');
      if(inp)inp.click();
    });
  });
  container.querySelectorAll('.img-file-input').forEach(function(inp){
    inp.addEventListener('change',function(){
      if(inp.files&&inp.files[0])handleImageUpload(inp.getAttribute('data-key'),inp.files[0]);
    });
  });
  container.querySelectorAll('.img-url-input').forEach(function(inp){
    inp.addEventListener('input',function(){
      var key=inp.getAttribute('data-key');
      markDirty(key,inp.value);
      var prev=container.querySelector('.img-preview-el[data-key="'+key+'"]');
      if(prev&&inp.value){prev.src=inp.value;prev.style.display='block';}
    });
  });

  // FAQ
  if(S.activeContentSection==='faq')attachFaqListeners(container);
}

function renderImageField(key,val){
  var hasImg=val&&val.trim();
  return '<div class="image-field">'+
    '<div class="image-preview">'+(hasImg?'<img src="'+esc(val)+'" alt="" class="img-preview-el" data-key="'+esc(key)+'">':'<span class="no-img">Aucune image</span>')+'</div>'+
    '<div class="image-actions">'+
      '<button class="btn btn-ghost btn-sm img-upload-btn" data-key="'+esc(key)+'">↑ Uploader</button>'+
      '<input type="file" accept="image/*" class="img-file-input sr-only" data-key="'+esc(key)+'">'+
      '<span id="up-'+key.replace(/\./g,'-')+'" style="font-size:.7rem;color:var(--gold);display:none">Envoi…</span>'+
    '</div>'+
    '<input type="text" class="cms-input img-url-input" placeholder="ou coller une URL…" value="'+esc(val)+'" data-key="'+esc(key)+'">'+
  '</div>';
}

async function handleImageUpload(key,file){
  if(!sb)return;
  var prog=document.getElementById('up-'+key.replace(/\./g,'-'));
  if(prog)prog.style.display='inline';
  var ext=file.name.split('.').pop();
  var name=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
  var res=await sb.storage.from('media').upload(name,file,{upsert:true});
  if(res.error){toast('Erreur upload : '+res.error.message,'error');}
  else{
    var url=sb.storage.from('media').getPublicUrl(name).data.publicUrl;
    markDirty(key,url);
    var prev=document.querySelector('.img-preview-el[data-key="'+key+'"]');
    var urlInp=document.querySelector('.img-url-input[data-key="'+key+'"]');
    if(prev){prev.src=url;prev.style.display='block';}
    if(urlInp)urlInp.value=url;
    toast('Image uploadée.','success');
  }
  if(prog)prog.style.display='none';
}

// ── FAQ EDITOR ────────────────────────────────────────────────────
function renderFaqEditor(jsonVal){
  var items=[];try{items=JSON.parse(jsonVal||'[]');}catch(e){}
  if(!Array.isArray(items))items=[];
  var html='<div class="faq-editor" id="faq-editor">';
  items.forEach(function(it,i){html+=renderFaqPair(it,i);});
  html+='<button class="btn btn-ghost btn-sm" id="faq-add-btn" style="margin-top:.3rem">+ Ajouter une question</button></div>';
  return html;
}
function renderFaqPair(it,i){
  return '<div class="faq-pair" data-faq-idx="'+i+'">'+
    '<p class="faq-pair-num">Question '+(i+1)+'</p>'+
    '<div class="faq-pair-row"><input class="cms-input faq-q-input" type="text" placeholder="Question…" value="'+esc(it.q||'')+'"><button class="btn btn-danger btn-xs faq-del-btn" data-idx="'+i+'">✕</button></div>'+
    '<textarea class="cms-textarea faq-a-input" placeholder="Réponse…">'+esc(it.a||'')+'</textarea>'+
  '</div>';
}
function getFaqItems(){
  var pairs=document.querySelectorAll('.faq-pair');var items=[];
  pairs.forEach(function(p){
    var q=p.querySelector('.faq-q-input');var a=p.querySelector('.faq-a-input');
    if(q&&a)items.push({q:q.value,a:a.value});
  });return items;
}
function attachFaqListeners(container){
  var editor=document.getElementById('faq-editor');if(!editor)return;
  function onChange(){markDirty('faq.items',JSON.stringify(getFaqItems()));var fd=document.querySelector('.cms-field[data-key="faq.items"]');if(fd)fd.classList.add('is-dirty');}
  editor.querySelectorAll('.faq-q-input,.faq-a-input').forEach(function(el){el.addEventListener('input',onChange);});
  editor.querySelectorAll('.faq-del-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var idx=parseInt(btn.getAttribute('data-idx'));var items=getFaqItems();items.splice(idx,1);
      markDirty('faq.items',JSON.stringify(items));
      var ed=document.getElementById('faq-editor');
      if(ed){ed.innerHTML=items.map(function(it,i){return renderFaqPair(it,i);}).join('')+'<button class="btn btn-ghost btn-sm" id="faq-add-btn">+ Ajouter une question</button>';attachFaqListeners(container);}
    });
  });
  var add=document.getElementById('faq-add-btn');
  if(add)add.addEventListener('click',function(){
    var items=getFaqItems();items.push({q:'',a:''});
    markDirty('faq.items',JSON.stringify(items));
    var ed=document.getElementById('faq-editor');
    if(ed){ed.innerHTML=items.map(function(it,i){return renderFaqPair(it,i);}).join('')+'<button class="btn btn-ghost btn-sm" id="faq-add-btn">+ Ajouter une question</button>';attachFaqListeners(container);var qs=ed.querySelectorAll('.faq-q-input');if(qs.length)qs[qs.length-1].focus();}
  });
}

// ── DESIGN PANEL ─────────────────────────────────────────────────
function renderDesign(panel){
  var html='<div class="panel-head"><h2>◑ Design</h2><p>Modifiez les couleurs du site. Les changements sont visibles après publication.</p></div>'+
    '<div class="design-grid">';
  DESIGN_COLORS.forEach(function(dc){

    html+='<div class="color-field">'+
      '<label class="cms-label">'+esc(dc.label)+'</label>'+
      '<div class="color-row">'+
        '<button class="color-swatch" style="background:'+esc(val)+'">'+
          '<input type="color" value="'+esc(val)+'" data-key="'+esc(dc.key)+'" data-var="'+esc(dc.var)+'">'+
        '</button>'+
        '<input class="color-val" type="text" value="'+esc(val)+'" data-key="'+esc(dc.key)+'" data-var="'+esc(dc.var)+'" maxlength="7">'+
      '</div>'+
    '</div>';
  });
  html+='</div>';
  panel.innerHTML=html;

  // Color picker ↔ text input sync
  panel.querySelectorAll('input[type=color]').forEach(function(picker){
    var key=picker.getAttribute('data-key');
    var varName=picker.getAttribute('data-var');
    var textInput=panel.querySelector('.color-val[data-key="'+key+'"]');
    var swatch=picker.parentElement;
    picker.addEventListener('input',function(){
      var v=picker.value;
      if(textInput)textInput.value=v;
      if(swatch)swatch.style.background=v;
      markDirty(key,v);
      // Live preview: update CSS var on site page
      var fd=panel.querySelector('.cms-field[data-key="'+key+'"]');if(fd)fd.classList.add('is-dirty');
    });
    if(textInput){
      textInput.addEventListener('input',function(){
        var v=textInput.value.trim();
        if(/^#[0-9a-fA-F]{6}$/.test(v)){
          if(picker)picker.value=v;
          if(swatch)swatch.style.background=v;
          markDirty(key,v);
        }
      });
    }
  });
}

// ── MEDIA LIBRARY ─────────────────────────────────────────────────
async function renderMedia(panel){
  panel.innerHTML='<div class="panel-head"><h2>⊡ Médiathèque</h2><p>Gérez vos images et fichiers. Cliquez pour copier l\'URL.</p></div>'+
    '<div class="upload-zone" id="upload-zone">'+
      '<div style="font-size:1.5rem">↑</div>'+
      '<p>Cliquez ou glissez des images ici pour les uploader</p>'+
    '</div>'+
    '<input type="file" id="media-file-input" accept="image/*" multiple class="sr-only">'+
    '<div id="media-grid-container"><p style="color:var(--muted);font-size:.78rem">Chargement…</p></div>';

  // Upload zone events
  var zone=document.getElementById('upload-zone');
  var fileInput=document.getElementById('media-file-input');
  zone.addEventListener('click',function(){fileInput.click();});
  zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('drag-active');});
  zone.addEventListener('dragleave',function(){zone.classList.remove('drag-active');});
  zone.addEventListener('drop',async function(e){
    e.preventDefault();zone.classList.remove('drag-active');
    if(e.dataTransfer.files.length)await uploadMediaFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change',async function(){
    if(fileInput.files.length)await uploadMediaFiles(fileInput.files);
  });

  await loadMedia();
}

async function loadMedia(){
  var container=document.getElementById('media-grid-container');
  if(!container||!sb)return;
  var res=await sb.storage.from('media').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});
  if(res.error){container.innerHTML='<p style="color:var(--danger)">Erreur : '+esc(res.error.message)+'</p>';return;}
  S.media=res.data||[];
  if(!S.media.length){container.innerHTML='<p style="color:var(--muted);font-size:.78rem">Aucun fichier. Uploadez votre première image.</p>';return;}
  var html='<div class="media-grid">';
  S.media.forEach(function(file){
    var url=sb.storage.from('media').getPublicUrl(file.name).data.publicUrl;
    html+='<div class="media-item" onclick="copyUrl(\''+esc(url)+'\')" title="Cliquer pour copier l\'URL">'+
      '<img src="'+esc(url)+'" alt="'+esc(file.name)+'" loading="lazy">'+
      '<div class="media-overlay">'+
        '<div style="font-size:.7rem;color:#fff">Copier l\'URL</div>'+
        '<div class="media-filename">'+esc(file.name)+'</div>'+
        '<button class="btn btn-danger btn-xs" onclick="event.stopPropagation();deleteMedia(\''+esc(file.name)+'\')">Supprimer</button>'+
      '</div>'+
    '</div>';
  });
  html+='</div>';
  container.innerHTML=html;
}

async function uploadMediaFiles(files){
  var arr=Array.from(files);
  for(var i=0;i<arr.length;i++){
    var file=arr[i];
    var ext=file.name.split('.').pop();
    var name=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
    var res=await sb.storage.from('media').upload(name,file,{upsert:true});
    if(res.error)toast('Erreur : '+res.error.message,'error');
    else toast('Fichier uploadé.','success');
  }
  await loadMedia();
}

async function deleteMedia(name){
  if(!confirm('Supprimer ce fichier ?'))return;
  await sb.storage.from('media').remove([name]);
  toast('Supprimé.','info');
  await loadMedia();
}

function copyUrl(url){
  navigator.clipboard.writeText(url).then(function(){toast('URL copiée !','success');}).catch(function(){toast('Impossible de copier','error');});
}
